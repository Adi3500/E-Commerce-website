        .navbar {
            display: flex;

            width: 100%;

            object-fit: cover;

        }

            color: white;
            text-decoration: none;
            margin: 0 15px;
        }
        
        .login-button {
            background-color: #ec502d;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .login-button:hover {
            background-color: #FF8C66;
        }
        
        #login-menu a {
            padding: 10px;

            text-decoration: none;

        }
        
        #login-menu {
            position: absolute;
            display: none;
            background-color: #333;
            min-width: 150px;

        }

        }
        
        #login-menu a:hover {

<body ng-app="myapp">

<script>
    var app = angular.module("myapp", ['ngRoute']);

    app.config(["$routeProvider", function($routeProvider) {
        $routeProvider.
        when("/category", {
            templateUrl: "category.php"

        }).
        when("/productMan", {
            templateUrl: "productMan.php"
        }).
        when("/userMan", {
            templateUrl: "userMan.php"
        }).
        when("/sellerman", {
            templateUrl: "sellerman.php"
        }).
        when("/", {
            templateUrl: "dashboard.php"
        });
        // }).
        // otherwise({
        //     redirectTo: "admin.html#!/user_home"
        // });

    }]);
    app.controller('usercontroller', function($scope, $http) {
        $http.get('admin_display.php')
            .then(function(response) {
                if (response.data.username) {
                    $scope.username = response.data.username;
                } else {
                    // Handle the case where session data is not available
                }
            })
            .catch(function(error) {
                // Handle errors
            });
    });
</script>
